; --------------------------------------------------------------------
; PHP-FPM pool hardening — incident MDA-2026-09-22
;
; nginx CANNOT close the persistence vector used in this incident.
; The gate was loaded through `auto_prepend_file` in a .user.ini file,
; which PHP-FPM reads off disk as configuration — it is never served
; over HTTP, so no nginx `deny` rule can reach it.
;
; Merge into the pool, e.g. /etc/php/8.5/fpm/pool.d/www.conf
; Then:  php-fpm8.5 -t && systemctl reload php8.5-fpm
;
; php_admin_value cannot be overridden by .user.ini or ini_set(),
; which is what makes these durable rather than advisory.
; --------------------------------------------------------------------

; ══ 1. The actual fix for this incident ═════════════════════════════

; Stop PHP scanning for .user.ini altogether. Nothing legitimate on
; these sites uses it, and it was persistence layer 1 of 6.
php_admin_value[user_ini.filename] =

; Belt and braces: even if a .user.ini is somehow read, it cannot set
; a prepend file over an admin value.
php_admin_value[auto_prepend_file] = none
php_admin_value[auto_append_file] = none


; ══ 2. Contain the file manager's reach ═════════════════════════════

; The shell browsed 23 directories across the whole server, including
; other tenants' web roots and /var/www-break/mailing-lists/public.
; open_basedir would have confined it to its own site.
;
; Set this PER POOL, one pool per site. With a single shared pool you
; must list every root, which defeats the purpose — if these sites
; share one pool, splitting them is the higher-value change.
;
; php_admin_value[open_basedir] = /var/www/mda:/var/lib/php/sessions:/tmp

; Disable the process-spawning functions the decrypted shell used.
; Check first that no site legitimately shells out (some backup and
; image plugins do):  grep -rE '\b(proc_open|shell_exec|popen)\s*\(' /var/www/<site>/wp-content
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,proc_nice,pcntl_exec,dl


; ══ 3. Reduce what a shell can pull in ══════════════════════════════

; Blocks include/require and file_get_contents over http:// — used by
; ms-bot-prepend.php to fetch the redirect target from its C2.
php_admin_flag[allow_url_include] = off
php_admin_flag[allow_url_fopen] = off
; NOTE: allow_url_fopen = off breaks plugins that use file_get_contents()
; on remote URLs instead of the WordPress HTTP API. Test before keeping.


; ══ 4. General hygiene ══════════════════════════════════════════════

php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/www-error.log

; Sessions outside the web root, so session files are never servable.
php_admin_value[session.save_path] = /var/lib/php/sessions
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.cookie_secure] = on

; The toolkit wrote files as the pool user. A separate, non-writable
; owner for code and a writable owner only for uploads is the
; structural fix, but at minimum do not run the pool as root.
; user = www-data
; group = www-data
